# Compila la app Android y la publica en la release "apk" (el botón de Ajustes descarga de ahí).
# La app carga la web desplegada en Render, así que solo hay que recompilar cuando cambia la parte nativa.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [android/**, capacitor.config.json, package.json, .github/workflows/android.yml]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run build && npx cap sync android
      # Clave de firma fija (secreto ANDROID_KEYSTORE, keystore en base64 con alias androiddebugkey / clave android).
      # Sin ella cada APK saldría con otra firma y Android no la instalaría encima: mejor fallar que publicarla.
      - name: Clave de firma
        env: { KEYSTORE: "${{ secrets.ANDROID_KEYSTORE }}" }
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Falta el secreto ANDROID_KEYSTORE"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/cencerro.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cencerro.keystore" >> "$GITHUB_ENV"
      - run: chmod +x gradlew && ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
        working-directory: android
      # Comprobación antes de publicar: el APK tiene que llevar el certificado de la clave fija.
      - name: Verificar firma
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee /dev/stderr | grep -q "CN=Cencerro Racing"
      - name: Publicar en la release "apk"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cencerro.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "App Android" --notes "APK de Box Box para el móvil del coche. Se actualiza sola con cada cambio de la parte Android."
          gh release upload apk cencerro.apk --clobber
          # El título termina en el versionCode: la app lo lee de la API de GitHub para saber si hay versión nueva.
          gh release edit apk --title "App Android · ${{ github.run_number }}" --notes "APK de Box Box para el móvil del coche. Se actualiza sola con cada cambio de la parte Android."
